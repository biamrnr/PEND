<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <!-- link do CSS externo -->
  <link rel="stylesheet" href="style.css">
  <!-- link do Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <!-- Estrutura do formulário de cadastro -->
  <div class="bloquinho">
    <h1>Cadastro</h1>
    <input type="text" id="nome" placeholder="Nome"><br>
    <input type="text" id="email" placeholder="Email"><br>
    <input type="text" id="telefone" placeholder="Telefone"><br>
    <div class="telefone">
      <!-- Botões para adicionar e remover campos de telefone -->
      <button type="button" id="addtelefone">➕</button><br>
      <button type="button" id="removertelefone">➖</button><br>
    </div>
    <!-- Campo para adicionar mais telefones dinamicamente -->
    <input type="text" id="endereco" placeholder="Endereço"><br>
    <input type="password" id="senha" placeholder="Senha">
    <!-- Ícone para mostrar/ocultar a senha -->
    <i class="bi bi-eye-fill icone" id="botaoSenha"></i>
    <!-- Mensagem para exibir o status da senha -->
    <p id="mensagem-senha"></p>
    <!-- Botão para enviar o formulário -->
    <button id="validar">Enviar</button>
    <p id="mensagem"></p>
  </div>
  <!-- link do JavaScript externo -->
  <script src="script.js"></script>
</body>

</html>
