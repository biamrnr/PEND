
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte seu Prato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🍽️ Monte seu prato</h1>
    <p>Arraste os ingredientes para o prato!</p>

    <div id="area">
        <div id="ingredientes">
            <h2>Ingredientes</h2>

            <div class="ingrediente" id="carne" draggable="true">
                🥩 Carne
            </div>

            <div class="ingrediente" id="frango" draggable="true">
                🍗 Frango
            </div>

            <div class="ingrediente" id="peixe" draggable="true">
                🐟 Peixe
            </div>

            <div class="ingrediente" id="salada" draggable="true">
                🥗 Salada
            </div>

            <div class="ingrediente" id="batata" draggable="true">
                🥔 Batata
            </div>

            <div class="ingrediente" id="queijo" draggable="true">
                🧀 Queijo
            </div>

            <div class="ingrediente" id="ovo" draggable="true">
                🥚 Ovo
            </div>
            <div class="ingrediente" id="arroz" draggable="true">
                🍚 Arroz
            </div>
            <div class="ingrediente" id="feijao" draggable="true">
                🫘 Feijão
            </div>
            <div class="ingrediente" id="macarrao" draggable="true">
                🍝 Macarrão
            </div>
        </div>

        <div>
            <h2>Seu prato</h2>3

            <div id="prato">
                <span id="textoPrato">🍽️</span>
            </div>
        </div>

        <div id="bebidas">
            <h2>🥤 Bebidas</h2>

            <div class="bebida" id="suco" draggable="true">
                🧃 Suco
            </div>

            <div class="bebida" id="refrigerante" draggable="true">
                🥤 Refrigerante
            </div>

            <div class="bebida" id="agua" draggable="true">
                💧 Água
            </div>

            <h2>Sua bebida</h2>

            <div id="copo">
                🥤
            </div>
        </div>

    </div>

    <p id="mensagem">Arraste os itens para montar seu pedido!</p>

    <script src="script.js"></script>

</body>
</html>
