
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Ponto</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Registro de Ponto</h1>

    <div id="conteudo">

        <div class="caixa">

            <h2>📍 Localização</h2>

            <p id="latitude">Latitude: aguardando...</p>

            <p id="longitude">Longitude: aguardando...</p>

            <p id="precisao">Precisão: aguardando...</p>

            <img id="localizacaoPermitida"
                src="https://i.pinimg.com/736x/2f/bd/cb/2fbdcb00f60bdb7ffc052ae9d8936a6d.jpg">

            <img id="localizacaoNegada"
                src="https://static.vecteezy.com/ti/vetor-gratis/p1/72724318-uma-preenchidas-grafico-do-uma-localizacao-pin-com-a-x-marca-indicando-errado-localizacao-ou-erro-gratis-vetor.jpg">

        </div>


        <div class="caixa">

            <h2>📷 Câmera</h2>

            <video id="camera" autoplay></video>

            <p>Utilize a câmera para realizar o registro de ponto.</p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
